<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign in &middot; Media Library</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:         #0b0919;
      --surface:    #130c25;
      --surface2:   #1b1035;
      --border:     #2d1a52;
      --pink:       #d4006b;
      --pink-dim:   rgba(212,0,107,0.18);
      --cyan:       #00e5e5;
      --cyan-dim:   rgba(0,229,229,0.12);
      --text:       #f0e6ff;
      --text-muted: #8870b0;
    }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .login-card {
      width: 100%; max-width: 360px;
      background: var(--surface); border: 1px solid var(--border);
      padding: 28px 26px;
    }
    .login-title {
      font-size: 15px; font-weight: 700; letter-spacing: .14em;
      text-transform: uppercase; color: var(--cyan); margin-bottom: 4px;
    }
    .login-sub { font-size: 12px; color: var(--text-muted); margin-bottom: 22px; }
    label {
      display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px;
    }
    input[type="text"], input[type="password"] {
      width: 100%; background: var(--surface2); color: var(--text);
      border: 1px solid var(--border); padding: 9px 11px; font-size: 13px;
      font-family: inherit; margin-bottom: 16px;
    }
    input[type="text"]:focus, input[type="password"]:focus {
      outline: none; border-color: var(--cyan);
    }
    .login-stay {
      display: flex; align-items: center; gap: 8px; margin-bottom: 20px;
    }
    .login-stay input { width: 15px; height: 15px; accent-color: var(--cyan); cursor: pointer; }
    .login-stay label {
      margin: 0; text-transform: none; letter-spacing: normal;
      font-size: 12px; font-weight: 400; color: var(--text-muted); cursor: pointer;
    }
    button {
      width: 100%; background: var(--pink-dim); color: var(--text);
      border: 1px solid var(--pink); padding: 10px; font-size: 12px;
      font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
      cursor: pointer; font-family: inherit;
    }
    button:hover { background: var(--pink); }
    .login-error {
      background: var(--pink-dim); border: 1px solid var(--pink);
      color: #ff7eb3; font-size: 12px; padding: 9px 11px; margin-bottom: 18px;
    }
  </style>
</head>
<body>
  <form class="login-card" action="{{ url_for('auth.login') }}" method="post">
    <div class="login-title">Media Library</div>
    <div class="login-sub">Sign in to continue</div>

    {% if error %}
    <div class="login-error" role="alert">{{ error }}</div>
    {% endif %}

    <input type="hidden" name="next" value="{{ next_target }}">

    <label for="username">Username</label>
    <input type="text" id="username" name="username" autocomplete="username" autofocus required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <div class="login-stay">
      <input type="checkbox" id="stay_signed_in" name="stay_signed_in" value="1">
      <label for="stay_signed_in">Stay signed in on this device for 30 days</label>
    </div>

    <button type="submit">Sign in</button>
  </form>
</body>
</html>
