<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} - Watch</title>
    <style>
        :root {
            --bg: #0b0919;
            --surface: #130c25;
            --surface2: #1b1035;
            --border: #2d1a52;
            --pink: #d4006b;
            --pink-glow: rgba(212, 0, 107, 0.55);
            --cyan: #00e5e5;
            --cyan-glow: rgba(0, 229, 229, 0.45);
            --text: #f0e6ff;
            --text-muted: #8870b0;

            --player-overlay-bg-top: rgba(11, 9, 25, 0.2);
            --player-overlay-bg-bottom: rgba(19, 12, 37, 0.9);
            --player-control-bg: rgba(27, 16, 53, 0.7);
            --player-control-bg-hover: rgba(27, 16, 53, 0.95);
            --player-control-border: rgba(0, 229, 229, 0.35);
            --player-control-border-hover: rgba(0, 229, 229, 0.7);
            --player-control-icon: var(--text);
            --player-control-icon-muted: var(--text-muted);
            --player-accent: var(--cyan);
            --player-time-text: var(--text);
            --player-note-bg: rgba(19, 12, 37, 0.88);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .player-container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: #000;
            position: relative;
            overflow: hidden;
        }
        
        .video-wrapper {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            width: 100%;
            max-width: 100vw;
            height: 100%;
            overflow: hidden;
            min-height: 0;
        }

        .video-wrapper.show-controls .controls-overlay {
            opacity: 1;
            pointer-events: auto;
        }
        
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        
        .top-bar {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
            height: 70px;
            flex-shrink: 0;
        }
        
        .title {
            font-size: 18px;
            font-weight: 600;
        }
        
        .back-button {
            background: none;
            border: none;
            color: var(--player-control-icon);
            cursor: pointer;
            line-height: 1;
            width: 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-button svg {
            width: 30px;
            height: 30px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: square;
        }
        
        .back-button:hover {
            color: var(--player-accent);
        }

        .status-message {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.78);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px 16px;
            font-size: 14px;
            color: #f0f0f0;
            z-index: 20;
            display: none;
            max-width: 80vw;
            text-align: center;
        }

        .controls-overlay {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 30;
            padding: 10px 16px 12px;
            background: linear-gradient(to top, var(--player-overlay-bg-bottom), var(--player-overlay-bg-top));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.24s ease;
        }

        .scrubber-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0;
        }

        .time-label {
            min-width: 54px;
            font-size: 13px;
            color: var(--player-time-text);
            text-align: center;
            font-variant-numeric: tabular-nums;
        }

        .seek-bar {
            flex: 1;
            accent-color: var(--player-accent);
            cursor: pointer;
        }

        .seek-bar {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: transparent;
        }

        .seek-bar::-webkit-slider-runnable-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .seek-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            margin-top: -4px;
            border-radius: 0;
            border: 1px solid rgba(0, 229, 229, 0.9);
            background: var(--player-accent);
        }

        .seek-bar::-moz-range-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .seek-bar::-moz-range-thumb {
            width: 12px;
            height: 12px;
            border-radius: 0;
            border: 1px solid rgba(0, 229, 229, 0.9);
            background: var(--player-accent);
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .right-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .control-btn {
            background: transparent;
            border: none;
            color: var(--player-control-icon);
            border-radius: 0;
            height: 32px;
            min-width: 36px;
            padding: 0 10px;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover,
        .control-btn:focus-visible {
            color: var(--player-accent);
            outline: none;
        }

        .control-btn[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .volume-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 150px;
        }

        .volume-bar {
            width: 92px;
            accent-color: var(--player-accent);
            cursor: pointer;
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            background: transparent;
            --volume-progress: 100%;
        }

        .spacer {
            flex: 1;
        }

        .seek-bar {
            --seek-progress: 0%;
        }

        .seek-bar::-webkit-slider-runnable-track {
            height: 6px;
            background: linear-gradient(
                to right,
                var(--player-accent) 0,
                var(--player-accent) var(--seek-progress),
                rgba(255, 255, 255, 0.22) var(--seek-progress),
                rgba(255, 255, 255, 0.22) 100%
            );
            border-radius: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .seek-bar::-moz-range-progress {
            height: 6px;
            background: var(--player-accent);
            border-radius: 0;
            border: 1px solid rgba(0, 229, 229, 0.9);
        }

        .volume-bar::-webkit-slider-runnable-track {
            height: 6px;
            background: linear-gradient(
                to right,
                var(--player-accent) 0,
                var(--player-accent) var(--volume-progress),
                rgba(255, 255, 255, 0.22) var(--volume-progress),
                rgba(255, 255, 255, 0.22) 100%
            );
            border-radius: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .volume-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 10px;
            height: 10px;
            margin-top: -3px;
            border-radius: 0;
            border: 1px solid rgba(0, 229, 229, 0.9);
            background: var(--player-accent);
        }

        .volume-bar::-moz-range-track {
            height: 6px;
            background: rgba(255, 255, 255, 0.22);
            border-radius: 0;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .volume-bar::-moz-range-progress {
            height: 6px;
            background: var(--player-accent);
            border-radius: 0;
            border: 1px solid rgba(0, 229, 229, 0.9);
        }

        .volume-bar::-moz-range-thumb {
            width: 10px;
            height: 10px;
            border-radius: 0;
            border: 1px solid rgba(0, 229, 229, 0.9);
            background: var(--player-accent);
        }

        .icon-btn {
            width: 30px;
            min-width: 30px;
            height: 30px;
            padding: 0;
        }

        .icon-btn svg {
            width: 30px;
            height: 30px;
            fill: currentColor;
            display: block;
        }

        .cc-btn {
            position: relative;
            width: 30px;
            min-width: 30px;
            height: 30px;
            padding: 0;
            border: 1px solid currentColor;
            background: transparent;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .cc-btn .cc-mark {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0;
            line-height: 1;
        }

        .cc-btn.cc-disabled::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            border-top: 1px solid currentColor;
            transform: rotate(40deg);
            transform-origin: center;
            opacity: 0.95;
            pointer-events: none;
        }

        .captions-wrap {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .captions-menu {
            position: absolute;
            right: 0;
            bottom: calc(100% + 10px);
            min-width: 180px;
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid var(--player-control-border-hover);
            background: rgba(19, 12, 37, 0.96);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
            z-index: 40;
        }

        .captions-menu[hidden] {
            display: none;
        }

        .captions-option {
            width: 100%;
            display: block;
            border: none;
            background: transparent;
            color: var(--player-control-icon);
            text-align: left;
            padding: 8px 10px;
            font-size: 12px;
            cursor: pointer;
        }

        .captions-option:hover,
        .captions-option:focus-visible {
            color: var(--player-accent);
            background: rgba(0, 229, 229, 0.08);
            outline: none;
        }

        .captions-option.active {
            color: var(--player-accent);
            background: rgba(0, 229, 229, 0.14);
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 720px) {
            .control-row {
                flex-wrap: wrap;
                gap: 8px;
            }

            .right-controls {
                gap: 8px;
            }

            .control-btn {
                min-width: 56px;
                padding: 0 8px;
            }

            .spacer {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="player-container">
        <div class="top-bar">
            <div class="title">{{ title }}</div>
            <a href="/" class="back-button" title="Back to library" aria-label="Back to library">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6L18 18M18 6L6 18"></path>
                </svg>
            </a>
        </div>
        
        <div class="video-wrapper">
            <video id="videoPlayer" crossorigin="anonymous">
                {% for sub in subtitles %}
                <track kind="subtitles" src="/api/video/{{ media_id }}/subtitle/{{ sub.index }}{% if episode %}?episode={{ episode|urlencode }}{% endif %}" srclang="{{ sub.lang }}" label="{{ sub.name }}">
                {% endfor %}
                Your browser does not support the video tag.
            </video>
            <div id="statusMessage" class="status-message"></div>
            <div id="controlOverlay" class="controls-overlay">
                <div class="scrubber-bar">
                    <div id="currentTimeLabel" class="time-label">0:00</div>
                    <input id="seekBar" class="seek-bar" type="range" min="0" max="100" value="0" step="0.1">
                    <div id="durationLabel" class="time-label">0:00</div>
                </div>
                <div class="control-row">
                    <button id="playPauseBtn" class="control-btn icon-btn" type="button" aria-label="Play or pause"><span class="sr-only">Play or pause</span></button>
                    <div class="spacer"></div>
                    <div class="right-controls">
                        <button id="muteBtn" class="control-btn icon-btn" type="button" aria-label="Mute or unmute"><span class="sr-only">Mute or unmute</span></button>
                        <input id="volumeBar" class="volume-bar" type="range" min="0" max="1" value="1" step="0.01" aria-label="Volume">
                        <div class="captions-wrap">
                            <button id="captionsBtn" class="control-btn cc-btn" type="button" aria-label="Captions language" aria-haspopup="true" aria-expanded="false"><span class="cc-mark" aria-hidden="true">CC</span><span class="sr-only">Captions language</span></button>
                            <div id="captionsMenu" class="captions-menu" hidden></div>
                        </div>
                        <button id="fullscreenBtn" class="control-btn icon-btn" type="button" aria-label="Toggle fullscreen"><span class="sr-only">Toggle fullscreen</span></button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('videoPlayer');
        const videoWrapper = document.querySelector('.video-wrapper');
        const statusMessage = document.getElementById('statusMessage');
        const controlOverlay = document.getElementById('controlOverlay');
        const seekBar = document.getElementById('seekBar');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const muteBtn = document.getElementById('muteBtn');
        const volumeBar = document.getElementById('volumeBar');
        const captionsBtn = document.getElementById('captionsBtn');
        const captionsMenu = document.getElementById('captionsMenu');
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        const currentTimeLabel = document.getElementById('currentTimeLabel');
        const durationLabel = document.getElementById('durationLabel');
        const mediaId = {{ media_id }};
        // Empty for films; for a TV episode it selects which file plays.
        const episodeParam = {{ (episode or '')|tojson }};
        const epQuery = episodeParam ? ('episode=' + encodeURIComponent(episodeParam)) : '';
        const withEp = (url) => (epQuery ? url + (url.includes('?') ? '&' : '?') + epQuery : url);
        const knownDurationSeconds = Number({{ (duration_seconds or 0)|tojson }});
    </script>
    <script src="{{ url_for('static', filename='js/player.js') }}"></script>
</body>
</html>
